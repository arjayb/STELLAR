name: STELLAR CG Restart Verify

on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-cg-restart.js'
      - '.github/workflows/verify-cg-restart.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify persisted CG media after restart
        env:
          STELLAR_BASE_URL: https://stellar-prove.onrender.com
        run: node scripts/verify-cg-restart.js
